plugins {
    id 'base'
}

def inheritedProps = new Properties()
file('../gradle.properties').withInputStream { inheritedProps.load(it) }
def prop = { String key ->
	project.findProperty(key) ?: rootProject.findProperty(key) ?: inheritedProps.getProperty(key)
}

ext.repoRootDir = file('..')
apply from: file('../gradle/versioning.gradle')

group = prop('maven_group')
version = resolvedModVersion

def forbiddenVersionedPlatformImport = ~/^import\s+(static\s+)?com\.darude\.platform\.v\d+\./

tasks.register('verifyNoVersionedPlatformImports') {
    group = 'verification'
    description = 'Fails if shared MC code imports a specific version band adapter'

    doLast {
        def violations = []
        fileTree('src').matching { include '**/*.java' }.each { File file ->
            file.eachLine { line ->
                def importLine = line.trim()
                if (importLine =~ forbiddenVersionedPlatformImport) {
                    violations << "${file.path}:${importLine}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("shared-mc includes forbidden imports:\n" + violations.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoVersionedPlatformImports')
}
