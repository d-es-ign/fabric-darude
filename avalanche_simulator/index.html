<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darude Avalanche Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="panel panel--controls">
        <div class="panel__intro">
          <h1>Darude Avalanche Simulator</h1>
          <p id="simulation-status"></p>
        </div>

        <div class="controls controls--timeline" aria-label="Timeline controls">
          <button id="step-back" type="button" aria-label="Previous step">-</button>
          <label class="controls__label" for="step-input" id="step-label">
            Step
            <input id="step-input" name="step-input" type="number" min="0" max="0" step="1" value="0" />
            of <span id="step-total">0</span>
          </label>
          <input id="step-slider" name="step-slider" type="range" min="0" max="0" step="1" value="0" />
          <button id="step-forward" type="button" aria-label="Next step">+</button>
        </div>

        <div class="controls controls--parameters" aria-label="Simulation parameters">
          <label class="controls__label" for="max-topples-input">
            Max topples (64)
            <input id="max-topples-input" name="max-topples-input" type="number" min="0" step="1" value="64" />
          </label>
          <label class="controls__label" for="threshold-input">
            Threshold (3)
            <input id="threshold-input" name="threshold-input" type="number" min="1" step="1" value="3" />
          </label>
          <button id="reset-parameters" type="button">Reset defaults</button>
        </div>

        <div class="panel__metrics">
          <dl class="stats" id="stats"></dl>
          <section class="warnings" id="warnings" aria-label="Simulation warnings"></section>
          <div class="charts-scroll">
            <div class="chart-panel">
              <canvas id="origin-height-chart" aria-label="Origin height over steps"></canvas>
            </div>
            <div class="chart-panel">
              <canvas id="topples-chart" aria-label="Topples per step"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="panel panel--map">
        <div class="map-layout">
          <div class="map-wrapper">
            <div class="heightmap-scale" id="heightmap-scale">
              <table class="heightmap" id="heightmap"></table>
            </div>
          </div>
          <aside class="topple-log" aria-label="Topples for current step">
            <h2 class="topple-log__title">Topples this step</h2>
            <ol class="topple-log__list" id="topple-log"></ol>
          </aside>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
  </html>
